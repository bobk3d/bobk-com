<!DOCTYPE html>
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>BobK</title>
<style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      width: min(1160px, calc(100% - 80px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 2.75rem;
      font-weight: 400;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .gallery-item {
      margin: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #ddd;
      cursor: pointer;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 760px) {
      main {
        width: calc(100% - 32px);
        padding-top: 18px;
      }

      h1 {
        margin-bottom: 18px;
        font-size: 2.4rem;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 0 24px rgba(0,0,0,.35);
    }
  
    .lightbox-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-size: 2rem;
      line-height: 1;
      width: 36px;
      height: 48px;
      cursor: pointer;
      z-index: 1001;
      user-select: none;
      padding: 0;
    }

    .lightbox-button:hover {
      color: #fff;
    }

    .lightbox-prev {
      left: 14px;
    }

    .lightbox-next {
      right: 14px;
    }

    .lightbox-counter {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      color: rgba(255, 255, 255, 0.82);
      font-size: 1rem;
      line-height: 1;
      user-select: none;
    }

    @media (max-width: 600px) {
      .lightbox-button {
        width: 32px;
        height: 44px;
        font-size: 1.8rem;
      }

      .lightbox-prev {
        left: 6px;
      }

      .lightbox-next {
        right: 6px;
      }

      .lightbox-counter {
        top: 14px;
        left: 14px;
        font-size: 0.95rem;
      }
    }

      .lightbox-prev {
        left: 6px;
      }

      .lightbox-next {
        right: 6px;
      }
    }

  </style>
</head>
<body>
<main>
<h1>Bob Karambelas</h1>
<div class="gallery" id="gallery"></div>
</main>
<div aria-hidden="true" class="lightbox" id="lightbox">
<div class="lightbox-counter" id="lightboxCounter">1 / 15</div>
<button aria-label="Previous image" class="lightbox-button lightbox-prev" id="lightboxPrev">←</button>
<img alt="" id="lightboxImage" src=""/>
<button aria-label="Next image" class="lightbox-button lightbox-next" id="lightboxNext">→</button>
</div>
<script>
    (function () {
      var gallery = document.getElementById("gallery");
      var lightbox = document.getElementById("lightbox");
      var lightboxImage = document.getElementById("lightboxImage");
      var prevButton = document.getElementById("lightboxPrev");
      var nextButton = document.getElementById("lightboxNext");
      var counter = document.getElementById("lightboxCounter");
      var images = [];
      var currentIndex = 0;

      function showImage(index) {
        currentIndex = (index + images.length) % images.length;
        lightboxImage.src = images[currentIndex].src;
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }

      function openLightbox(index) {
        showImage(index);
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImage.src = "";
      }

      function buildGallery(config) {
        gallery.innerHTML = "";

        config.images.forEach(function (item, index) {
          var figure = document.createElement("figure");
          figure.className = "gallery-item";
          figure.id = item.id;

          var img = document.createElement("img");
          img.src = item.src;
          img.alt = "";
          img.loading = "lazy";

          img.addEventListener("click", function () {
            openLightbox(index);
          });

          figure.appendChild(img);
          gallery.appendChild(figure);
        });

        images = Array.prototype.slice.call(
          document.querySelectorAll(".gallery-item img")
        );
      }

      prevButton.addEventListener("click", function (event) {
        event.stopPropagation();
        if (images.length) showImage(currentIndex - 1);
      });

      nextButton.addEventListener("click", function (event) {
        event.stopPropagation();
        if (images.length) showImage(currentIndex + 1);
      });

      lightboxImage.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      lightbox.addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function (event) {
        if (!lightbox.classList.contains("open")) return;

        if (event.key === "Escape") {
          closeLightbox();
        } else if (event.key === "ArrowLeft" && images.length) {
          showImage(currentIndex - 1);
        } else if (event.key === "ArrowRight" && images.length) {
          showImage(currentIndex + 1);
        }
      });

      fetch("gallery.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(buildGallery)
        .catch(function (error) {
          gallery.textContent = "Could not load gallery.";
          console.error(error);
        });
    }());
</script>
</body>
</html>
