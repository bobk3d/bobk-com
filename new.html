<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BobK</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      width: min(1160px, calc(100% - 80px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 2.75rem;
      font-weight: 400;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .gallery-item {
      margin: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #ddd;
      cursor: pointer;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 760px) {
      main {
        width: calc(100% - 32px);
        padding-top: 18px;
      }

      h1 {
        margin-bottom: 18px;
        font-size: 2.4rem;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 0 24px rgba(0,0,0,.35);
    }
  
    .lightbox-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 3rem;
      line-height: 1;
      width: 58px;
      height: 72px;
      cursor: pointer;
      z-index: 1001;
      user-select: none;
    }

    .lightbox-button:hover {
      background: rgba(0, 0, 0, 0.55);
    }

    .lightbox-prev {
      left: 16px;
    }

    .lightbox-next {
      right: 16px;
    }

    @media (max-width: 600px) {
      .lightbox-button {
        width: 46px;
        height: 60px;
        font-size: 2.4rem;
      }

      .lightbox-prev {
        left: 6px;
      }

      .lightbox-next {
        right: 6px;
      }
    }

  </style>
</head>
<body>
  <main>
    <h1>Bob Karambelas</h1>

    <div class="gallery" id="gallery">
        <figure class="gallery-item" id="image01">
          <img src="images/DSCF2062.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image02">
          <img src="images/RKXH7469.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image03">
          <img src="images/IMG_0118-1.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image04">
          <img src="images/RKXH6529.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image05">
          <img src="images/RKXH8408.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image06">
          <img src="images/RKXH6755.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image07">
          <img src="images/RKXW1018-1.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image08">
          <img src="images/_DSF3705.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image09">
          <img src="images/BOBK8698.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image10">
          <img src="images/_MG_8473-2.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image11">
          <img src="images/RKXW0459.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image12">
          <img src="images/07090534.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image13">
          <img src="images/OBK1052-Edit-1052.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image14">
          <img src="images/RKXT1268-2.jpg" alt="" loading="lazy">
        </figure>
        <figure class="gallery-item" id="image15">
          <img src="images/RKXT1380.jpg" alt="" loading="lazy">
        </figure>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-button lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#10094;</button>
    <img id="lightboxImage" src="" alt="">
    <button class="lightbox-button lightbox-next" id="lightboxNext" aria-label="Next image">&#10095;</button>
  </div>

  <script>
    (function () {
      var lightbox = document.getElementById("lightbox");
      var lightboxImage = document.getElementById("lightboxImage");
      var prevButton = document.getElementById("lightboxPrev");
      var nextButton = document.getElementById("lightboxNext");
      var images = Array.prototype.slice.call(
        document.querySelectorAll(".gallery-item img")
      );
      var currentIndex = 0;

      function showImage(index) {
        currentIndex = (index + images.length) % images.length;
        lightboxImage.src = images[currentIndex].src;
      }

      function openLightbox(index) {
        showImage(index);
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImage.src = "";
      }

      images.forEach(function (img, index) {
        img.addEventListener("click", function () {
          openLightbox(index);
        });
      });

      prevButton.addEventListener("click", function (event) {
        event.stopPropagation();
        showImage(currentIndex - 1);
      });

      nextButton.addEventListener("click", function (event) {
        event.stopPropagation();
        showImage(currentIndex + 1);
      });

      lightboxImage.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      lightbox.addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function (event) {
        if (!lightbox.classList.contains("open")) return;

        if (event.key === "Escape") {
          closeLightbox();
        } else if (event.key === "ArrowLeft") {
          showImage(currentIndex - 1);
        } else if (event.key === "ArrowRight") {
          showImage(currentIndex + 1);
        }
      });
    }());
  </script>

</body>
</html>
