<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BobK</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; }
main { width: min(1160px, calc(100% - 80px)); margin: 0 auto; padding: 24px 0 40px; }
h1 { margin: 0 0 24px; font-size: 2.75rem; font-weight: 400; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.gallery-item { margin: 0; aspect-ratio: 4 / 5; overflow: hidden; background: #ddd; cursor: pointer; }
.gallery-item img { display: block; width: 100%; height: 100%; object-fit: cover; }

@media (max-width: 760px) {
  main { width: calc(100% - 32px); padding-top: 18px; }
  h1 { margin-bottom: 18px; font-size: 2.4rem; }
  .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
}
@media (max-width: 480px) { .gallery { grid-template-columns: 1fr; } }

.lightbox {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 0, 0, 0.92);
  z-index: 1000;
  cursor: default;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 96vw;
  max-height: 94vh;
  width: auto;
  height: auto;
  object-fit: contain;
  box-shadow: 0 0 24px rgba(0,0,0,.35);
}

.lightbox-control {
  position: fixed;
  z-index: 1001;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.82);
  opacity: 0;
  transition: opacity .28s ease, color .18s ease;
  pointer-events: none;
  user-select: none;
}
.lightbox.controls-visible .lightbox-control {
  opacity: 1;
  pointer-events: auto;
}
button.lightbox-control { cursor: pointer; padding: 0; }
button.lightbox-control:hover { color: #fff; }

.lightbox-arrow {
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 38px;
  font-size: 1.35rem;
  line-height: 1;
}
.lightbox-prev { left: 10px; }
.lightbox-next { right: 10px; }
.lightbox-counter {
  top: 16px;
  left: 18px;
  font-size: .9rem;
  line-height: 1;
}
.lightbox-fullscreen,
.lightbox-close {
  top: 11px;
  width: 32px;
  height: 32px;
  font-size: 1.25rem;
  line-height: 32px;
  text-align: center;
}
.lightbox-fullscreen { right: 48px; }
.lightbox-close { right: 12px; font-size: 1.45rem; }

@media (max-width: 600px) {
  .lightbox { padding: 12px; }
  .lightbox-arrow { width: 26px; height: 36px; font-size: 1.25rem; }
  .lightbox-prev { left: 4px; }
  .lightbox-next { right: 4px; }
  .lightbox-counter { top: 12px; left: 12px; font-size: .85rem; }
  .lightbox-fullscreen, .lightbox-close { top: 7px; }
  .lightbox-fullscreen { right: 42px; }
  .lightbox-close { right: 7px; }
}
</style>
</head>
<body>
<main>
  <h1>Bob Karambelas</h1>
  <div class="gallery" id="gallery"></div>
</main>

<div aria-hidden="true" class="lightbox" id="lightbox">
  <div class="lightbox-control lightbox-counter" id="lightboxCounter">1 / 15</div>
  <button aria-label="Previous image" class="lightbox-control lightbox-arrow lightbox-prev" id="lightboxPrev">←</button>
  <img alt="" id="lightboxImage" src="">
  <button aria-label="Next image" class="lightbox-control lightbox-arrow lightbox-next" id="lightboxNext">→</button>
  <button aria-label="Fullscreen" class="lightbox-control lightbox-fullscreen" id="lightboxFullscreen">⛶</button>
  <button aria-label="Close" class="lightbox-control lightbox-close" id="lightboxClose">×</button>
</div>

<script>
(function () {
  var gallery = document.getElementById("gallery");
  var lightbox = document.getElementById("lightbox");
  var lightboxImage = document.getElementById("lightboxImage");
  var prevButton = document.getElementById("lightboxPrev");
  var nextButton = document.getElementById("lightboxNext");
  var fullscreenButton = document.getElementById("lightboxFullscreen");
  var closeButton = document.getElementById("lightboxClose");
  var counter = document.getElementById("lightboxCounter");
  var images = [];
  var currentIndex = 0;
  var controlsTimer = null;

  function showControls() {
    lightbox.classList.add("controls-visible");
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(function () {
      lightbox.classList.remove("controls-visible");
    }, 1400);
  }

  function showImage(index) {
    currentIndex = (index + images.length) % images.length;
    lightboxImage.src = images[currentIndex].src;
    counter.textContent = (currentIndex + 1) + " / " + images.length;
    showControls();
  }

  function openLightbox(index) {
    showImage(index);
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden", "false");
    showControls();
  }

  function closeLightbox() {
    clearTimeout(controlsTimer);
    lightbox.classList.remove("open", "controls-visible");
    lightbox.setAttribute("aria-hidden", "true");
    lightboxImage.src = "";
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
  }

  function buildGallery(config) {
    gallery.innerHTML = "";
    images = config.images.map(function (item) {
      return { src: item.src };
    });

    config.images.forEach(function (item, index) {
      var figure = document.createElement("figure");
      figure.className = "gallery-item";
      figure.id = item.id;

      var img = document.createElement("img");
      img.src = item.src;
      img.alt = item.title || "";
      img.loading = "lazy";
      img.addEventListener("click", function () { openLightbox(index); });

      figure.appendChild(img);
      gallery.appendChild(figure);
    });
  }

  prevButton.addEventListener("click", function (event) {
    event.stopPropagation();
    if (images.length) showImage(currentIndex - 1);
  });

  nextButton.addEventListener("click", function (event) {
    event.stopPropagation();
    if (images.length) showImage(currentIndex + 1);
  });

  fullscreenButton.addEventListener("click", function (event) {
    event.stopPropagation();
    if (!document.fullscreenElement) {
      lightbox.requestFullscreen().catch(function () {});
    } else {
      document.exitFullscreen().catch(function () {});
    }
    showControls();
  });

  closeButton.addEventListener("click", function (event) {
    event.stopPropagation();
    closeLightbox();
  });

  lightboxImage.addEventListener("click", function (event) {
    event.stopPropagation();
  });

  lightbox.addEventListener("mousemove", showControls);
  lightbox.addEventListener("mouseenter", showControls);
  lightbox.addEventListener("click", closeLightbox);

  document.addEventListener("keydown", function (event) {
    if (!lightbox.classList.contains("open")) return;
    showControls();
    if (event.key === "Escape") {
      closeLightbox();
    } else if (event.key === "ArrowLeft" && images.length) {
      showImage(currentIndex - 1);
    } else if (event.key === "ArrowRight" && images.length) {
      showImage(currentIndex + 1);
    }
  });

  fetch("gallery.json", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(buildGallery)
    .catch(function (error) {
      gallery.textContent = "Could not load gallery.";
      console.error(error);
    });
}());
</script>
</body>
</html>
