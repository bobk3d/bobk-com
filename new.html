<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bob Karambelas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 40px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 2rem;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .gallery-item {
      margin: 0;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #ddd;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 760px) {
      main {
        width: 100%;
        padding-top: 18px;
      }

      h1 {
        margin: 0 16px 18px;
        font-size: 1.6rem;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bob Karambelas</h1>

    <div class="gallery" id="gallery">
        <figure class="gallery-item" id="image01">
          <img src="images/DSCF2062.jpg" alt="" loading="lazy">
