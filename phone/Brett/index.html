<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Brett - 3D Photos</title>
<link rel="stylesheet" href="../viewer.css">
</head>
<body>
<section id="landing" class="screen active">
  <div class="landing-card">
    <h1 id="landingName">Brett</h1>
    <p id="landingText"></p>
    <p>For best results, rotate your phone to landscape orientation before viewing.</p>
    <button id="viewBtn" class="primary" type="button">View Photos</button>
  </div>
</section>
<section id="viewer" class="screen">
  <div class="viewer-main"><img id="photo" src="" alt=""></div>
  <div class="controls">
    <button id="backBtn" class="control-button" type="button">Home</button>
    <button id="pauseBtn" class="control-button" type="button">Pause</button>
    <div class="meta"><span id="title"></span> · <span id="counter"></span></div>
    <div class="nav-buttons">
      <button id="prevBtn" class="control-button" type="button">‹</button>
      <button id="nextBtn" class="control-button" type="button">›</button>
    </div>
  </div>
</section>
<script src="config.js"></script>
<script src="../viewer.js"></script>
</body>
</html>
